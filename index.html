<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cisco Exam Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Header épuré -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-dot"></span>
        <span class="brand-title">Cisco Exam Prep</span>
      </a>

      <div class="topbar-actions">
        <a href="#/request" class="btn-request-nav" id="nav-request-link">
          + Demander un cours
        </a>
        <button type="button" class="btn-text" id="btn-reset-progress" title="Réinitialiser les scores">
          Réinitialiser
        </button>
        <button type="button" class="btn-icon" id="btn-theme-toggle" title="Changer de thème" aria-label="Changer de thème">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- VUE 1 : Accueil -->
    <section id="view-home" class="view active">
      <div class="container">
        <div class="page-intro">
          <h1>Examens &amp; Entraînements</h1>
          <div class="category-tabs" id="category-tabs"></div>
        </div>
        <div class="courses-grid" id="courses-grid"></div>
      </div>
    </section>

    <!-- VUE 2 : Liste des Quizz du cours -->
    <section id="view-course" class="view">
      <div class="container" id="course-dashboard-content"></div>
    </section>

    <!-- VUE 3 : Question en cours -->
    <section id="view-quiz" class="view">
      <div class="container container-narrow" id="quiz-session-content"></div>
    </section>

    <!-- VUE 4 : Résultats -->
    <section id="view-results" class="view">
      <div class="container container-narrow" id="quiz-results-content"></div>
    </section>

    <!-- VUE 5 : Demander l'ajout d'un cours -->
    <section id="view-request" class="view">
      <div class="container container-narrow" id="request-course-content"></div>
    </section>
  </main>

  <!-- Zoom image -->
  <div class="lightbox-backdrop" id="image-lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Fermer">&times;</button>
    <img src="" alt="Illustration" id="lightbox-img" />
  </div>

  <!-- Confirmation simple -->
  <div class="modal-backdrop" id="confirm-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modal-title">Confirmation</h3>
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Annuler</button>
        <button type="button" class="btn btn-primary" id="modal-confirm">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="data/fallback-bundle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
